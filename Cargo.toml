[package]
name = "hiturbo-rs"
version = "0.1.0"
edition = "2024"
description = "OVERFLEW / HITURBO Wi-Fi camera and flight desktop"

[dependencies]
eframe = { version = "0.33.3", default-features = false, features = ["glow", "x11", "wayland", "default_fonts", "persistence"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
if-addrs = "0.15"
sdl2 = "0.38"
socket2 = "0.6"
kamadak-exif = "0.6"

[profile.release]
lto = "thin"
strip = true

